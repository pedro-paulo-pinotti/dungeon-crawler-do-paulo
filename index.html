async function getPeerOptions() {
  let iceServers = defaultIceServers.slice();
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 2000);
    const res = await fetch('https://openrelay.metered.ca/api/v1/turn/credentials?apiKey=openrelayproject', { signal: ctrl.signal });
    clearTimeout(tid);
    if (res.ok) {
      const dynamicServers = await res.json();
      if (Array.isArray(dynamicServers) && dynamicServers.length > 0) {
        iceServers = [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          ...dynamicServers
        ];
      }
    }
  } catch (e) {}
  return {
    debug: 1,
    pingInterval: 5000,
    config: {
      iceCandidatePoolSize: 10,
      iceServers
    }
  };
}

function isSoloMode(){

function isLookingAt(e, maxDist=3.2, dotThreshold=0.82){
  const dx = e.x - P.x;
  const dy = (e.y + 0.8) - (P.y + 1.5);
  const dz = e.z - P.z;
  const dist = Math.hypot(dx, dy, dz);
  if(dist > maxDist) return false;
  
  const nx = dx / dist, ny = dy / dist, nz = dz / dist;
  const ca = Math.cos(P.a), sa = Math.sin(P.a);
  const cp = Math.cos(P.p), sp = Math.sin(P.p);
  const fx = ca * cp, fy = sp, fz = sa * cp;
  
  const dot = nx * fx + ny * fy + nz * fz;
  return dot >= dotThreshold;
}

async function initPeer(hostRoomId = null) {
  if(myPeer) { try { myPeer.destroy(); } catch(e){} myPeer = null; }
  peerConnections = []; remotePlayers = {}; myPeerId = '';
  netStatus = 'Preparando rede P2P/TURN...';

  if(!hostRoomId) {
    const shortCode = 'ABISMO-' + Math.floor(1000 + Math.random() * 9000);
    networkState.roomName = shortCode;
    networkState.isHost = true;
    networkState.players = [{id: 'pending', name: 'Host', cls: networkState.selectedClass}];
  } else {
    let cleanId = hostRoomId.trim().toUpperCase().replace(/\s+/g, '');
    if(/^\d{4}$/.test(cleanId)) cleanId = 'ABISMO-' + cleanId;
    networkState.roomName = cleanId;
    networkState.isHost = false;
    networkState.players = [];
  }

  const opts = await getPeerOptions();
  if(state !== 6) return;

  if(!hostRoomId) {
    const shortCode = networkState.roomName;
    netStatus = 'Registrando sala no servidor...';
    myPeer = new Peer(shortCode, opts);
    myPeer.on('open', id => {
      myPeerId = id;
      networkState.players = [{id, name: 'Host', cls: networkState.selectedClass}];
      netStatus = 'Sala aberta! Passe o código ao amigo.';
      try{ navigator.clipboard.writeText(id); say('Código copiado: ' + id); }catch(e){}
    });
  } else {
    const cleanId = networkState.roomName;
    netStatus = 'Conectando ao servidor P2P...';
    myPeer = new Peer(opts);
    myPeer.on('open', id => {
      myPeerId = id;
      netStatus = 'Conectando ao Host ' + cleanId + '...';
      const connectToHost = () => {
        if(!myPeer || myPeer.destroyed || peerConnections.some(c => c.open)) return;
        const conn = myPeer.connect(cleanId, { reliable: true, serialization: 'json' });
        setupConn(conn);
      };
      connectToHost();
      setTimeout(() => {
        if(myPeer && !myPeer.destroyed && !peerConnections.some(c => c.open)) {
          netStatus = 'Tentando rota alternativa (TURN)...';
          connectToHost();
        }
      }, 5500);
      setTimeout(() => {
        if(myPeer && !myPeer.destroyed && !peerConnections.some(c => c.open)) {
          netStatus = 'Sem resposta do Host. Confira o código.';
          say('Falha na conexão. Verifique o código da sala.');
        }
      }, 16000);
    });
  }

myPeer.on('connection', conn => {
    if (networkState.players.length >= 4) {
      setTimeout(() => { if (conn) conn.close(); }, 500);
      return;
    }
    setupConn(conn);
  });
  myPeer.on('error', err => {
    console.error('PeerJS Error:', err);
    if(err.type === 'unavailable-id' && networkState.isHost) {
      initPeer(null);
      return;
    }
    const errMsg = err.type === 'peer-unavailable'
      ? 'Sala não encontrada! Confira o código.'
      : 'Erro de rede (' + (err.type || 'desconhecido') + ')';
    netStatus = errMsg;
    say(errMsg);
  });
  myPeer.on('disconnected', () => {
    if(myPeer && !myPeer.destroyed) {
      try { myPeer.reconnect(); } catch(e) {}
    }
  });
}

function setupConn(conn) {
  if(!conn) return;
  conn.on('iceStateChanged', st => {
    if(st === 'checking') netStatus = 'Negociando rota NAT/ICE...';
    else if(st === 'connected' || st === 'completed') netStatus = 'Conectado!';
    else if(st === 'failed') {
      netStatus = 'Falha ICE/NAT. Tentando relay...';
      say('Bloqueio NAT detectado, tentando reconectar...');
    }
  });
  conn.on('open', () => {
    peerConnections = peerConnections.filter(c => c.peer !== conn.peer && c.open);
    peerConnections.push(conn);
    netStatus = 'Conectado! Escolha sua classe.';
    if(!networkState.isHost) {
      const joinPayload = { t: 'JOIN_REQ', id: myPeerId, name: 'Aliado ' + (peerConnections.length + 1), cls: networkState.selectedClass };
      sendNetMsg(joinPayload);
      setTimeout(() => {
        if(networkState.players.length === 0) sendNetMsg(joinPayload);
      }, 600);
    } else {
      sendNetMsg({ t: 'LOBBY_UPDATE', players: networkState.players, roomName: networkState.roomName });
      if(state === 1) sendFullStateSync(conn.peer);
    }
  });
  conn.on('data', data => onNetMsg(data, conn));
  conn.on('close', () => {
    peerConnections = peerConnections.filter(c => c !== conn && c.open);
    if(!peerConnections.some(c => c.peer === conn.peer)) {
      networkState.players = networkState.players.filter(p => p.id !== conn.peer);
      delete remotePlayers[conn.peer];
      if(networkState.isHost) {
        sendNetMsg({ t: 'LOBBY_UPDATE', players: networkState.players, roomName: networkState.roomName });
      } else {
        netStatus = 'Desconectado do Host.';
        say('Conexão com o Host encerrada.');
      }
    }
  });
  conn.on('error', err => console.error('Conn error:', err));
}

function sendNetMsg(msg, excludePeer = null) {
  if(isSoloMode()) return;
  peerConnections.forEach(c => {
    if(c && c.open && c.peer !== excludePeer) {
      try { c.send(msg); } catch(e) {}
    }
  });
}

function sendFullStateSync(targetPeer = null) {
  if(!networkState.isHost || state !== 1) return;
  const openDoors = ents.filter(e => e.t === 'D' && e.dead).map(e => e.uid);
  const pulledLevers = ents.filter(e => e.t === 'L' && e.on).map(e => e.uid);
  const activeRunes = ents.filter(e => e.t === 'R' && e.on).map(e => e.uid);
  const msg = {
    t: 'FULL_STATE_SYNC',
    base,
    fl,
    keys: P.keys,
    puz,
    raidState: raidState ? { active: raidState.active, total: raidState.total, killed: raidState.killed, spawned: raidState.spawned, completed: raidState.completed } : null,
    openDoors,
    pulledLevers,
    activeRunes,
    worldEnts: ents.filter(e => ['C','c','K','g','i','I','f'].includes(e.t) && !e.dead)
  };
  peerConnections.forEach(c => {
    if(c && c.open && (!targetPeer || c.peer === targetPeer)) {
      try { c.send(msg); } catch(e) {}
    }
  });
}

    }
    else if(m.t === 'JOIN_REQ' && networkState.isHost) {
      let existing = networkState.players.find(p => p.id === m.id);
      if(!existing) {
        networkState.players.push({id: m.id, name: m.name, cls: m.cls ?? null});
        say('Aliado entrou na sala!');
        snd(660, .15, 'triangle');
      } else if(m.cls !== undefined && m.cls !== null) {
        existing.cls = m.cls;

      sendNetMsg({ t: 'LOBBY_UPDATE', players: networkState.players, roomName: networkState.roomName });
      if(state === 1) sendFullStateSync(m.id);

      if(me && me.cls !== undefined && me.cls !== null) networkState.selectedClass = me.cls;
    }
    else if(m.t === 'START_GAME') {
      base = m.base;
      const clsToStart = (networkState.selectedClass !== null && networkState.selectedClass !== undefined) ? networkState.selectedClass : 0;
      startC(clsToStart, base);
    }
    else if(m.t === 'FULL_STATE_SYNC' && !networkState.isHost) {
      if(state !== 1) {
        const clsToStart = (networkState.selectedClass !== null && networkState.selectedClass !== undefined) ? networkState.selectedClass : 0;
        startC(clsToStart, m.base);
      }
      const baseChanged = base !== m.base;
      base = m.base;
      if(fl !== m.fl || baseChanged) { fl = m.fl; gen(); }
      P.keys = m.keys || 0;

      if(m.activeRunes) ents.forEach(e => { if(e.t === 'R' && m.activeRunes.includes(e.uid)) e.on = 1; });
      if(m.worldEnts) {
        ents = ents.filter(e => !['C','c','K','g','i'].includes(e.t));
        m.worldEnts.forEach(we => ents.push(we));
      }
      say('Sincronizado com a partida do Host!');
    }
    else if(m.t === 'POS') {
      if(m.fl !== fl || m.bs !== base) { // jogador em outra torre/mapa: não mostrar nem interagir
        delete remotePlayers[m.id];
        if(networkState.isHost) {
          sendNetMsg(m, m.id);

        }
        return;
      }
      let rp = remotePlayers[m.id];
      if(!rp) {
        rp = { id: m.id, x: m.x, y: m.y, z: m.z, a: m.a, tx: m.x, ty: m.y, tz: m.z, ta: m.a };
        remotePlayers[m.id] = rp;
      }
      rp.tx = m.x; rp.ty = m.y; rp.tz = m.z; rp.ta = m.a;
      rp.hp = m.hp; rp.mh = m.mh; rp.cls = m.cls; rp.blk = m.blk;
      rp.torchLit = m.torchLit; rp.downed = m.downed; rp.downTimer = m.downTimer;
      if(m.sw > 0 && (!rp.sw || rp.sw <= 0)) rp.sw = m.sw;
      if(networkState.isHost) sendNetMsg(m, m.id);
    }
    else if(m.t === 'ACTION') {
      if(m.act === 'ATK' && remotePlayers[m.id]) remotePlayers[m.id].sw = .25;
      if(m.act === 'CAST_ICE') {
        ents.push({t:'I', x:m.x, z:m.z, y:m.y, life:5, tk:0, remote:true});
        for(let i=0;i<8;i++) spawnParticle(m.x+(rnd()-.5)*4, m.y+2, m.z+(rnd()-.5)*4, 0, -2, 0, [0.4,0.8,1], 0.6, 0.14);

    }
    else if(m.t === 'HIT_ENT' && networkState.isHost) {
      const e = ents.find(x => x.uid === m.uid);

      const aliveUids = new Set();

        } else {
          localE.tx = se.x;
          localE.ty = se.y;
          localE.tz = se.z;
          localE.hp = se.hp;
          if(se.mh) localE.mh = se.mh;
          if(se.fl > 0) localE.fl = se.fl;
        }
      }
      for(const e of ents) {
        if((isE(e.t) || e.t === 'b' || e.t === 'T') && !aliveUids.has(e.uid)) {

        }

        raidState.killed = m.raid.killed;
        raidState.active = m.raid.active;
        raidState.completed = m.raid.completed;
      }
    }
  } catch(e){}
}

function spinRoulette(){
  if(!P.eq.w){ say('Você precisa ter uma ARMA equipada!'); snd(150,.1,'sawtooth'); return; }
  if(P.gold < 50){ say('Ouro insuficiente (50 Ouro)!'); snd(150,.1,'sawtooth'); return; }
  P.gold -= 50;
  if(rnd() < 0.15){
    say('A ROLETA FALHOU! SUA ARMA FOI DESTRUÍDA!');
    delete P.eq.w; stats(); snd(100,.4,'sawtooth'); return;
  }
  const count = ri(1, 3);
  const pool = ['dmg','ls','as','cr','mg','sr'];
  for(let i=0; i<count; i++){
    let eff = pool[ri(0, pool.length-1)];
    let val = EF[eff](1.5 + fl*.2);
    P.eq.w[eff] = (P.eq.w[eff] || 0) + val;
  }
  P.eq.w.q = Math.min(3, (P.eq.w.q || 0) + 1);
  P.eq.w.n = 'Encantada: ' + P.eq.w.n;
  say('SUCESSO! +'+count+' Efeito(s) Adicionado(s)!');
  stats(); snd(800,.3,'triangle');
}

function buyShopItem(i){
  const s = shopItems[i];
  if(!s) return;
  if(P.gold < s.price){
    say('Ouro insuficiente! (' + s.price + ' G)');
    snd(150, .1, 'sawtooth');
    return;
  }
  if(P.inv.length >= 9){
    say('Mochila cheia! (9/9)');
    snd(150, .1, 'sawtooth');
    return;
  }
  P.gold -= s.price;
  P.inv.push(Object.assign({}, s.it));
  shopItems.splice(i, 1);
  stats();
  say('Comprado: ' + s.it.n + ' [I]');
  snd(600, .15, 'triangle');
}

function sellShopItem(i){
  if(i < 0 || i >= P.inv.length) return;
  const it = P.inv.splice(i, 1)[0];
  const val = Math.round((it.q + 1) * 12 + fl * 5);
  P.gold += val;
  say('Vendido: +' + val + ' Ouro');
  snd(500, .15, 'triangle');
}
